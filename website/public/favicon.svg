<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Shield/Hex Background -->
  <rect width="240" height="240" rx="48" fill="#090D16" />
  <rect x="4" y="4" width="232" height="232" rx="44" stroke="url(#glowGrad)" stroke-width="2" stroke-opacity="0.3" />

  <!-- Waveform Rings -->
  <circle cx="120" cy="120" r="85" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 8" stroke-opacity="0.3" />
  <circle cx="120" cy="120" r="65" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.4" />

  <!-- Futuristic Microphone & Wave Icon -->
  <g filter="url(#neonBlur)">
    <!-- Mic Body -->
    <rect x="104" y="70" width="32" height="60" rx="16" fill="url(#glowGrad)" />
    <!-- Mic Arc Grille Lines -->
    <line x1="104" y1="92" x2="136" y2="92" stroke="#090D16" stroke-width="2.5" />
    <line x1="104" y1="102" x2="136" y2="102" stroke="#090D16" stroke-width="2.5" />
    <!-- Mic Stand Arc -->
    <path d="M88 112 C88 138, 152 138, 152 112" stroke="url(#glowGrad)" stroke-width="6" stroke-linecap="round" fill="none" />
    <!-- Stand Base -->
    <line x1="120" y1="138" x2="120" y2="162" stroke="url(#glowGrad)" stroke-width="6" stroke-linecap="round" />
    <line x1="98" y1="162" x2="142" y2="162" stroke="url(#glowGrad)" stroke-width="6" stroke-linecap="round" />
    <!-- Sub-3ms Lightning Accent -->
    <path d="M148 76 L134 94 L142 94 L132 114" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
